name: False positive
description: A finding that does not represent a real risk.
labels: [false-positive]
body:
  - type: input
    id: rule
    attributes: { label: Rule ID, placeholder: NGB003 }
    validations: { required: true }
  - type: textarea
    id: code
    attributes: { label: Minimal code that triggers it, render: ts }
    validations: { required: true }
  - type: textarea
    id: why
    attributes: { label: Why is this safe?, description: Which validation / trust boundary does NgBastion miss? }
    validations: { required: true }
  - type: textarea
    id: finding
    attributes: { label: Finding output (JSON or terminal), render: text }
