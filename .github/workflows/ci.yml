name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.3', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The website is built and tested in its own job (it needs installed example apps for its demo data).
      - run: pnpm turbo run build --filter="./packages/*"
      - run: pnpm turbo run typecheck --filter="./packages/*"
      - run: pnpm lint
      - name: README rule tables match the registry
        run: node scripts/sync-rule-docs.mjs --check
      - name: Unit, integration and Angular 20/21/22 compatibility tests
        run: pnpm test
      - name: Offline HTML report browser tests
        if: matrix.node == '24'
        run: node tests/browser/report.mjs

  coverage:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter="./packages/*"
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/coverage-summary.json
          retention-days: 14

  self-scan:
    name: scan the vulnerable showcase (SARIF validity smoke test)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter="./packages/*"
      # The showcase is intentionally vulnerable: exit code 1 (gate failed) is the expected result.
      - run: |
          set +e
          node packages/cli/dist/bin.js scan examples/vulnerable-showcase --format sarif --output showcase.sarif
          code=$?
          test "$code" -eq 1
      - uses: actions/upload-artifact@v7
        with:
          name: showcase-sarif
          path: showcase.sarif
          retention-days: 7

  website:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (packages + Angular/Analog website, SSG with post-build verification)
        run: pnpm build
      - name: Website unit tests (Vitest + Angular TestBed)
        run: pnpm --filter @ngbastion/website test
