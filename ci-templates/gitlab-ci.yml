# Include in .gitlab-ci.yml
ngbastion:
  stage: test
  image: node:24
  variables:
    NGBASTION_CMD: "npx --yes ngbastion@0.1.0" # replace with a local build until published
    NGBASTION_FAIL_ON: "high"
  script:
    - npm ci
    - $NGBASTION_CMD scan --format sarif --output ngbastion.sarif --fail-on none
    # Exit code 1 = gate failed, 2 = configuration/execution error; both fail the job.
    - $NGBASTION_CMD scan --format json --output ngbastion.json --fail-on "$NGBASTION_FAIL_ON"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - ngbastion.json
      - ngbastion.sarif
